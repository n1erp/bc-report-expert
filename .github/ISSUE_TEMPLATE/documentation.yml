name: 📘 Documentation
description: Something in the docs is missing, unclear or wrong.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link or path, for example docs/ARCHITECTURE.md › Report center.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text (optional)
